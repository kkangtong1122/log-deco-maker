<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글꾸미기 </title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&display=swap');
@font-face{font-family:'Ridibatang';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff');font-weight:normal;font-display:swap}
@font-face{font-family:'GangwonEduModu';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEdu_OTFLightA.woff') format('woff');font-weight:300;font-display:swap}
@font-face{font-family:'GangwonEduModu';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEdu_OTFBoldA.woff') format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'OngleipParkDahyeon';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2411-3@1.0/Ownglyph_ParkDaHyun.woff2') format('woff2');font-weight:normal;font-display:swap}
:root{
  --bg-page:#f4f3ee; --bg-panel:#faf9f5; --bg-elem:#ffffff; --bg-hover:#eceae2;
  --text:#1c1c1a; --text-2:#5f5e5a; --text-3:#9a988f;
  --border:#dcdad2; --border-2:#c4c2b8;
  --accent:#ba728a; --accent-bg:#f9e7ef; --accent-text:#7b3c55;
  --danger:#A32D2D; --danger-bg:#fcebeb;
  --radius:8px; --radius-lg:12px;
}
.dark{
  --bg-page:#1a1a18; --bg-panel:#222220; --bg-elem:#2a2a28; --bg-hover:#34332f;
  --text:#ededea; --text-2:#a8a69e; --text-3:#74726b;
  --border:#3a3935; --border-2:#4d4c46;
  --accent:#dda0b6; --accent-bg:#49303d; --accent-text:#f6d5e0;
  --danger:#e08585; --danger-bg:#3a2020;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13px;color:var(--text);background:var(--bg-page)}
svg.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex-shrink:0}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg-panel);border-bottom:0.5px solid var(--border)}
.topbar h1{font-size:16px;font-weight:600;display:flex;align-items:center;gap:7px}
.topbar h1 svg.ic{width:18px;height:18px;stroke:var(--accent)}
.topbar .spacer{flex:1}
.app{display:grid;grid-template-columns:294px minmax(0,1fr) 316px;height:calc(100vh - 49px)}
.panel{overflow:hidden;display:flex;flex-direction:column;min-height:0}
.panel-scroll{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
.left{background:var(--bg-panel);border-right:0.5px solid var(--border)}
.right{background:var(--bg-panel);border-left:0.5px solid var(--border)}
.right .panel-scroll{padding:0}
.center{background:var(--bg-page);min-width:0}
.toolbar{display:flex;gap:6px;padding:8px 12px;border-bottom:0.5px solid var(--border);background:var(--bg-panel);align-items:center;flex-wrap:wrap}
.tlabel{font-size:11px;color:var(--text-3)}
.canvas-outer{flex:1;overflow:auto;padding:16px;min-height:0}
.sec-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
button{font-family:inherit;font-size:12px;padding:5px 8px;border:0.5px solid var(--border-2);border-radius:6px;background:var(--bg-elem);color:var(--text);cursor:pointer;transition:background .1s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;justify-content:center}
button:hover{background:var(--bg-hover)}
button:disabled{opacity:.4;cursor:not-allowed}
button.danger{border-color:var(--danger);color:var(--danger)}
button.danger:hover{background:var(--danger-bg)}
button.accent{border-color:var(--accent);color:var(--accent-text)}
button.mini{font-size:10px;padding:3px 6px;gap:3px}
button.on{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent)}
button.icon{padding:5px;width:30px;height:30px}
.hint{font-size:10px;color:var(--text-3);line-height:1.5;margin-top:4px}
.divider{border:none;border-top:0.5px solid var(--border)}
.row{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.row .lab{font-size:11px;color:var(--text-2);width:56px;flex-shrink:0}
input[type=color]{width:28px;height:24px;border:0.5px solid var(--border-2);border-radius:4px;padding:1px;cursor:pointer;background:none;flex-shrink:0}
input[type=color]:disabled{opacity:.3}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.num{width:44px;font-size:11px;padding:3px 5px;border:0.5px solid var(--border-2);border-radius:4px;background:var(--bg-elem);color:var(--text);text-align:right;flex-shrink:0}
.hex{width:72px;font-size:10px;font-family:ui-monospace,monospace;padding:3px 5px;border:0.5px solid var(--border-2);border-radius:4px;background:var(--bg-elem);color:var(--text);flex-shrink:0}
input[type=text],select,textarea{font-size:11px;padding:4px 6px;border:0.5px solid var(--border-2);border-radius:4px;background:var(--bg-elem);color:var(--text);font-family:inherit}
.row input[type=text]:not(.num):not(.hex),.row select,.row textarea{flex:1;min-width:0}
.no-sel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:36px 12px;color:var(--text-3);text-align:center}
textarea.out{width:100%;min-height:80px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;padding:6px;border:0.5px solid var(--border-2);border-radius:6px;resize:vertical;background:var(--bg-elem);color:var(--text)}
.tree-node{font-size:11px;cursor:pointer;border-radius:4px;padding:3px 5px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-node:hover{background:var(--bg-hover)}
.tree-node.sel{background:var(--accent-bg);color:var(--accent-text)}
.tree-node svg.ic{width:13px;height:13px}
.tree-node .tree-main{display:flex;align-items:center;gap:5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-node .tree-actions{display:flex;gap:2px;flex-shrink:0;margin-left:auto}
.tree-node .tree-actions button{font-size:10px;padding:2px 5px;line-height:1.3}
.tree-node .tree-toggle{border:0!important;padding:0!important;min-width:15px;width:15px;height:17px;display:inline-flex;align-items:center;justify-content:center;background:transparent!important;color:var(--text-2);font-size:13px;flex-shrink:0}
.tree-node .tree-toggle:disabled{opacity:.35}

.canvas-settings{background:var(--bg-elem);border:1px solid var(--border);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:8px}
.canvas-settings .row{margin:0}
.canvas-settings .lab{width:68px}
.canvas-settings input[type=number]{width:74px}
.canvas-settings select{flex:1;min-width:0}
.canvas-settings .bg-presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.canvas-settings .bg-presets button{font-size:10px;min-height:31px;white-space:normal}
.layer-tools{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:9px}
.layer-tools button{white-space:normal;font-size:11px}

.canvas-root{min-height:480px;border:1.5px dashed var(--border-2);border-radius:8px;padding:12px;background:var(--bg-elem)}
.canvas-root.dark-preview{outline:3px solid #8e83b1;outline-offset:4px}
.rwrap{position:relative;max-width:100%;min-width:0}
/* 요소의 빈 부분을 직접 끌어 이동. ⋯ 버튼은 마우스 오른쪽 메뉴의 터치 대체 수단. */
.rwrap>.rbox{cursor:grab!important}
.rwrap>.rbox:active{cursor:grabbing!important}
.rwrap.sel-outline>.rbox{touch-action:none}
.rwrap.node-locked>.rbox{cursor:default!important}
.node-more{position:absolute;top:-11px;right:-10px;width:25px;height:25px;z-index:40;border:1px solid var(--accent)!important;background:var(--bg-elem)!important;color:var(--accent-text)!important;border-radius:7px!important;padding:0!important;font-size:18px!important;line-height:1;box-shadow:0 2px 8px #0002}
.node-locked>.rbox{outline-style:dashed!important}
.canvas-root.library-drop-ready{outline:3px dashed var(--accent)!important;outline-offset:4px}
.canvas-drop-mark{pointer-events:none;position:absolute;width:25px;height:25px;border-radius:50%;border:2px solid #fff;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;z-index:9999;box-shadow:0 2px 13px #38203245;font-size:16px}
.node-context-menu{position:fixed;z-index:10000;min-width:218px;max-width:calc(100vw - 16px);background:var(--bg-elem);border:1px solid var(--border-2);border-radius:12px;padding:6px;box-shadow:0 12px 36px #120d2038}
.node-context-menu button{display:flex;width:100%;justify-content:flex-start;text-align:left;white-space:normal;min-height:33px;border:0!important;border-radius:6px!important;font-size:12px;padding:7px 9px!important}
.node-context-menu button:hover{background:var(--accent-bg)}
.node-context-menu hr{border:0;border-top:1px solid var(--border);margin:5px 3px}
.node-context-menu .danger-action{color:#c64c68}
.canvas-help{font-size:10px;color:var(--text-3);margin-top:5px}
.rwrap.sel-outline>.rbox{outline:2px solid var(--accent);outline-offset:1px}
.side-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;flex:1}
.side-grid button{padding:3px 2px;font-size:10px}
.side-row{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.side-row button{padding:3px 2px;font-size:10px}
.recent-row{display:flex;gap:4px;flex-wrap:wrap;margin:-2px 0 8px 63px}
.swatch{width:18px;height:18px;border-radius:4px;border:0.5px solid var(--border-2);cursor:pointer;padding:0}
.color-trigger{width:28px;height:24px;border-radius:4px;border:0.5px solid var(--border-2);cursor:pointer;flex-shrink:0;background-clip:padding-box}
.color-pop{position:fixed;z-index:200;background:var(--bg-elem);border:0.5px solid var(--border-2);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px;width:202px}
.color-pop .pop-title{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin:0 0 5px}
.color-pop .pop-title:not(:first-child){margin-top:10px}
.sw-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.sw{width:100%;aspect-ratio:1;border-radius:4px;border:0.5px solid rgba(128,128,128,.25);cursor:pointer;padding:0}
.sw.empty{background:transparent;border-style:dashed;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:11px}
.pop-custom{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:8px;border-top:0.5px solid var(--border)}
.pop-custom input[type=color]{width:30px;height:26px}
.pop-backdrop{position:fixed;inset:0;z-index:199}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.theme-cell{cursor:pointer;border-radius:6px;padding:5px 3px;text-align:center;border:0.5px solid var(--border)}
.theme-cell:hover{background:var(--bg-hover)}
.theme-cell{background:var(--bg-elem);color:inherit;font:inherit}
.theme-grid-more{margin-top:6px}
.theme-toggle{display:block;width:100%;margin-top:7px;padding:8px 9px;border:1px solid var(--border-2);border-radius:7px;background:var(--bg-elem);color:var(--text-2);font-size:11px;cursor:pointer;text-align:center}
.theme-toggle:hover{background:var(--bg-hover)}
.theme-dots{display:flex;gap:2px;justify-content:center;margin-bottom:3px}
.theme-dot{width:11px;height:11px;border-radius:3px;border:0.5px solid rgba(128,128,128,.3)}
.theme-cell span{font-size:10px;color:var(--text-2)}
.sel-header{background:var(--bg-panel);padding:10px 12px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.sel-header .name{font-weight:500;font-size:13px;display:flex;align-items:center;gap:6px}
.core-block{padding:12px;border-bottom:0.5px solid var(--border)}
.tabs{display:flex;border-bottom:0.5px solid var(--border);position:sticky;top:0;background:var(--bg-panel);z-index:4}
.tab{flex:1;text-align:center;padding:9px 0;font-size:12px;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px}
.tab.active{color:var(--accent-text);border-bottom-color:var(--accent);font-weight:500}
.tab-body{padding:12px}
.save-status{font-size:10px;color:var(--text-3)}
.mobile-tabs{display:none}
.subsec{margin-top:12px}
.subsec:first-child{margin-top:0}
.import-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:center;justify-content:center}
.import-modal{background:var(--bg-elem);border-radius:12px;width:560px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,.25)}
.import-header{padding:14px 18px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.import-header h3{font-size:15px;font-weight:600}
.import-body{padding:18px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.import-body textarea{width:100%;min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;padding:10px;border:0.5px solid var(--border-2);border-radius:6px;resize:vertical;background:var(--bg-panel);color:var(--text)}
.import-body .preview-box{border:1.5px dashed var(--border-2);border-radius:8px;padding:12px;min-height:60px;background:var(--bg-panel);overflow:auto;max-height:200px}
.import-footer{flex-wrap:wrap;padding:14px 18px;border-top:0.5px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
@media(max-width:860px){
  .app{grid-template-columns:1fr;height:auto}
  .panel{height:auto}
  .left,.right{border:none;border-bottom:0.5px solid var(--border)}
  .center{order:-1}
  .canvas-outer{padding:10px}
  .mobile-tabs{display:flex;gap:5px;padding:8px 12px;background:var(--bg-panel);border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:30}
  .mobile-tabs button{flex:1}
}

/* 꾸미기 아틀리에 확장 */
.preset-cats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.preset-cats button{font-size:11px;padding:9px 2px}
.preset-cards{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.preset-card{min-height:83px;white-space:normal;display:flex;align-items:flex-start;flex-direction:column;text-align:left;padding:11px 10px!important;gap:6px!important;justify-content:flex-start!important;border:1px solid var(--border)!important;border-radius:9px!important;background:var(--bg-elem)!important;transition:transform .14s,box-shadow .14s}
.preset-card:hover{transform:translateY(-2px);box-shadow:0 5px 14px #00000013}
.preset-card .p-title{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600}
.preset-card .p-icon{font-size:20px;line-height:1}
.preset-card .p-desc{font-size:10px;color:var(--text-3);font-weight:400;line-height:1.4;white-space:normal}
.decor-action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:7px 0 12px}
.decor-action-grid button{white-space:normal;min-height:39px;font-size:11px}
.decor-hint{font-size:10px;line-height:1.7;color:var(--text-3);margin-top:8px}
.sel-header{flex-wrap:wrap;gap:6px}
@keyframes atelier-pulse{0%,100%{filter:brightness(1);transform:scale(1)}50%{filter:brightness(1.18);transform:scale(1.012)}}
@keyframes atelier-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes atelier-twinkle{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}
@media(prefers-reduced-motion:reduce){.rbox{animation:none!important}}
@media(max-width:1080px) and (min-width:861px){.app{grid-template-columns:270px minmax(0,1fr) 285px}}

/* UI 개편: 조용한 로즈 톤, 목적별 라이브러리, 실제 HTML 축소 미리보기 */
.library-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px 12px 9px;border-bottom:1px solid var(--border)}
.library-switch button{height:36px;font-size:13px;font-weight:600;border-color:transparent;background:transparent}
.library-switch button.on{background:var(--accent-bg);color:var(--accent-text);border-color:var(--border)}
.library-scroll{gap:14px;padding:12px}
.library-section{display:flex;flex-direction:column;gap:10px}
.library-section[hidden]{display:none!important}
.library-label{font-size:11px;color:var(--text-3)}
.library-search{display:block;width:100%;height:34px;min-height:34px;padding:7px 10px!important;border-radius:8px!important;font-size:12px!important}
.material-categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.category-btn{width:100%;height:38px;min-width:0;justify-content:flex-start!important;gap:8px;padding:0 10px!important;font-size:12px!important;border-color:var(--border)!important;border-radius:8px!important}
.category-btn>span:first-child{width:19px;text-align:center;font-size:15px;color:var(--accent)}
.category-btn>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.category-btn.on,.category-chip.on{background:var(--accent-bg)!important;color:var(--accent-text)!important;border-color:var(--accent)!important}
.library-divider{border-top:1px solid var(--border);margin:3px 0}
.library-group-title{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:12px;color:var(--text);margin:2px 0 0}
.small-count{color:var(--text-3);font-size:10px;font-weight:400}
.library-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start}
.library-card{min-width:0;position:relative;overflow:hidden;border:1px solid var(--border)!important;border-radius:10px!important;background:var(--bg-elem)!important;display:flex;flex-direction:column;gap:4px!important;padding:6px!important;align-items:stretch!important;justify-content:flex-start!important;white-space:normal!important;transition:transform .12s,border-color .12s!important;text-align:left!important}
.library-card:hover{border-color:var(--accent)!important;transform:translateY(-1px)}
.library-card[draggable="true"]{cursor:grab;user-select:none;-webkit-user-drag:element}
.library-card[draggable="true"]:active{cursor:grabbing}
#template-cards .library-thumb,#user-templates .library-thumb{height:96px}
.library-card-title{font-size:11px;font-weight:600;display:block;width:100%;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;line-height:1.55;color:var(--text)}
.library-thumb{position:relative;width:100%;height:78px;overflow:hidden;background:#f9f6f5;border:1px solid #eee6e7;border-radius:7px;pointer-events:none;contain:layout paint}
.thumb-document{position:absolute;width:320px;transform-origin:top left;display:flex;flex-direction:column;gap:8px;font:14px/1.6 'Noto Sans KR',sans-serif;color:#473d48;overflow:visible;pointer-events:none}
.thumb-document *{box-sizing:border-box}
.thumb-frame{height:400px;width:420px;border:none;background:#fffdfb}
.thumb-empty{font-size:10px;color:var(--text-3)}
.library-subheading{grid-column:1/-1;color:var(--text-2);font-size:11px;margin-top:5px;font-weight:600}
.library-empty{grid-column:1/-1;font-size:11px;color:var(--text-3);line-height:1.7;padding:12px 4px}
.library-nest{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-2);padding:3px 0;cursor:pointer}
.library-nest input{accent-color:var(--accent)}
.library-subaction{width:100%;min-height:34px;font-size:11px!important;border:1px dashed var(--border-2)!important}
.template-categories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.category-chip{font-size:11px!important;min-height:32px;padding:5px!important;border-color:var(--border)!important}
.user-card{padding:0!important;display:block}
.library-card-main{display:block;border:0!important;background:transparent!important;width:100%;padding:7px!important;text-align:left;white-space:normal;overflow:hidden}
.user-delete{position:absolute;right:6px;top:5px;z-index:2;width:20px;height:20px;border-radius:50%;background:var(--bg-elem);font-size:15px;padding:0;line-height:1}
.user-card .library-card-title{padding-right:24px}
.library-fold{border-top:1px solid var(--border);padding:8px 0}
.library-fold summary{cursor:pointer;font-size:12px;font-weight:600;user-select:none;padding:6px 2px}
.library-fold>div{margin-top:10px}
.library-fold #canvas-settings{width:100%}
.library-footer-actions{display:grid;grid-template-columns:1fr;gap:5px}
.library-footer-actions button{min-height:32px;white-space:normal}
.file-menu-wrap{position:relative}
.file-menu{position:absolute;z-index:120;top:calc(100% + 6px);left:0;min-width:198px;border:1px solid var(--border);background:var(--bg-elem);border-radius:10px;padding:6px;box-shadow:0 14px 28px #0002}
.file-menu[hidden]{display:none}
.file-menu button{display:block;text-align:left;width:100%;border:0;background:transparent;padding:9px 10px;white-space:nowrap;font-size:12px}
.file-menu button:hover{background:var(--bg-hover)}
.output-collapsible{border-top:1px solid var(--border);padding:10px 12px}
.output-collapsible>summary{font-size:12px;font-weight:600;cursor:pointer;padding:3px 0}
.output-inner{padding-top:10px}
.inspector-tabs{position:sticky;top:0;background:var(--bg-panel);z-index:4;display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border)}
.inspector-tabs button{border:0;border-radius:0;background:transparent;padding:11px 2px;color:var(--text-3);font-size:11px;border-bottom:2px solid transparent}
.inspector-tabs button.active{font-weight:700;color:var(--accent-text);border-bottom-color:var(--accent);background:var(--accent-bg)}
.inspector-body{min-height:180px;padding:0 12px 14px}
.inspector-body .core-block{padding:12px 0}
.inspector-tip{font-size:11px;color:var(--text-3);line-height:1.8;padding:16px 0}
.material-save-inline{margin-left:4px;font-size:10px}
.library-modal-overlay{position:fixed;inset:0;z-index:350;background:#1b1426a3;display:flex;align-items:center;justify-content:center;padding:15px}
.library-dialog,.template-dialog{width:min(450px,100%);max-height:90vh;overflow:auto;background:var(--bg-panel);border-radius:16px;padding:19px;box-shadow:0 18px 50px #0003}
.library-dialog h3,.template-dialog h3{font-size:17px;font-weight:600}
.library-dialog p,.template-dialog p{font-size:11px;color:var(--text-2);margin:10px 0;line-height:1.7}
.library-dialog label{display:block;font-size:11px;font-weight:600;margin-top:12px}
.library-dialog input,.library-dialog select{display:block;width:100%;padding:9px!important;font-size:12px!important;margin-top:6px}
.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.dialog-actions button{padding:9px 12px}
.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:15px}
.template-preview-large{overflow:auto;max-height:53vh;background:#f0e9ec;padding:18px;display:flex;justify-content:center;border-radius:12px}
.template-preview-content{width:420px;flex:0 0 420px;background:#fffdfa;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;transform-origin:top center;max-width:none}
@media(max-width:860px){.app{height:calc(100dvh - 99px);min-height:360px;display:flex}.panel{height:100%;width:100%;overflow:hidden}.panel-scroll{overflow:auto}.canvas-outer{overflow:auto}.topbar{flex-wrap:wrap;padding:7px 10px;gap:6px}.save-status{display:none}.library-thumb{height:84px}#template-cards .library-thumb,#user-templates .library-thumb{height:97px}.material-categories{grid-template-columns:repeat(2,minmax(0,1fr))}.template-preview-content{transform:scale(.68);margin:-35px -60px -45px}}
@media(max-width:430px){.topbar h1{font-size:13px}.topbar .mini{font-size:10px;padding:5px}.material-categories{grid-template-columns:repeat(2,minmax(0,1fr))}.library-thumb{height:77px}#template-cards .library-thumb,#user-templates .library-thumb{height:87px}.library-card-title{font-size:12px}.sel-header{flex-wrap:wrap}.material-save-inline{width:100%}}

/* PPT 조작 모드: 평소에는 텍스트 선택 금지, 더블클릭 편집할 때만 허용. */
#canvas .rbox, #canvas .rbox * {user-select:none;-webkit-user-select:none}
#canvas .atelier-editable-text {white-space:pre-wrap;min-height:1em;cursor:inherit}
#canvas .atelier-editable-text[contenteditable="true"] {user-select:text!important;-webkit-user-select:text!important;cursor:text!important;outline:1px dashed var(--accent);outline-offset:3px;min-width:2px}
#canvas .rwrap.node-locked>.rbox {cursor:default!important}
/* 크기 조절 위치는 투명한 히트 영역으로만 표시. 마우스 모양이 방향을 알려줌. */
#canvas .rresize-handle {position:absolute;z-index:31;background:transparent!important;border:0!important;border-radius:0!important;opacity:0!important;pointer-events:none;touch-action:none}
#canvas .rwrap.sel-outline:not(.node-locked)>.rresize-handle {pointer-events:auto}
#canvas .rresize-handle[data-edge="n"] {top:-6px;left:20%;right:20%;height:12px;cursor:ns-resize}
#canvas .rresize-handle[data-edge="s"] {bottom:-6px;left:20%;right:20%;height:12px;cursor:ns-resize}
#canvas .rresize-handle[data-edge="e"] {right:-6px;top:20%;bottom:20%;width:12px;cursor:ew-resize}
#canvas .rresize-handle[data-edge="w"] {left:-6px;top:20%;bottom:20%;width:12px;cursor:ew-resize}
#canvas .rresize-handle[data-edge="ne"] {right:-7px;top:-7px;width:14px;height:14px;cursor:nesw-resize}
#canvas .rresize-handle[data-edge="sw"] {left:-7px;bottom:-7px;width:14px;height:14px;cursor:nesw-resize}
#canvas .rresize-handle[data-edge="nw"] {left:-7px;top:-7px;width:14px;height:14px;cursor:nwse-resize}
#canvas .rresize-handle[data-edge="se"] {right:-7px;bottom:-7px;width:14px;height:14px;cursor:nwse-resize}
#canvas .node-more {display:none;top:-28px;right:-21px}
#canvas .rwrap.sel-outline>.node-more {display:inline-flex;align-items:center;justify-content:center}


/* 5차: PPT식 다중 선택. 텍스트 수정/캔버스 출력에는 영향을 주지 않아요. */
#canvas { position:relative; }
#canvas .rwrap.multi-outline > .rbox { outline:2px solid #7c77ce;outline-offset:2px; }
#canvas .rwrap.multi-outline.node-locked > .rbox {outline-style:dashed;}
#canvas.multi-select-active .rwrap > .rresize-handle,
#canvas.multi-select-active .rwrap > .node-more {pointer-events:none;display:none!important;}
#canvas .selection-marquee {position:absolute;pointer-events:none;z-index:9998;border:1.5px solid #9d639a;background:rgba(198,137,176,.16);border-radius:2px;box-shadow:inset 0 0 0 1px #ffffff55;}
.tree-node.multi-tree-sel{background:var(--accent-bg);box-shadow:inset 3px 0 #8f82cc;}
.multi-tools {padding:10px 12px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:var(--accent-bg)}
.multi-tools .multi-count{font-size:11px;font-weight:600;color:var(--accent-text);margin-right:auto}
.multi-tools button{font-size:11px}
.bulk-header {padding:14px 12px 8px;font-size:12px;font-weight:700}
.bulk-panel {padding:12px;display:flex;flex-direction:column;gap:13px}
.bulk-panel .theme-grid {grid-template-columns:repeat(4,minmax(0,1fr));}
.bulk-panel .theme-cell{background:var(--bg-elem);font-family:inherit}
.bulk-colors {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bulk-colors label{padding:7px 5px;border:1px solid var(--border);border-radius:7px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:var(--text-2)}
.bulk-colors input[type=color]{width:100%;height:30px;}
#multi-pick-btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-text)}

/* 6차: PPT처럼 드래그하여 회전하는 손잡이. 선택 요소 외에는 숨겨요. */
.canvas-outer{padding-top:59px;}
#canvas .rrotate-handle {
  position:absolute;z-index:100;display:none;align-items:center;justify-content:center;
  width:29px;height:29px;padding:0!important;border:1.5px solid #b77f9b!important;
  background:#fffafd!important;color:#924a70!important;border-radius:50%!important;
  box-shadow:0 2px 9px #58334c33!important;cursor:grab!important;
  user-select:none;-webkit-user-select:none;touch-action:none;
  transform:translate(-50%,-50%);transition:background .12s;
}
#canvas .rrotate-handle:hover{background:#fae8f1!important;border-color:#a94f7f!important;}
#canvas .rrotate-handle:active{cursor:grabbing!important;}
#canvas .rrotate-handle svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.15;fill:none;pointer-events:none;}
#canvas .rrotate-handle::after{
  content:'';position:absolute;top:26px;left:50%;height:12px;width:1.5px;
  background:#b77f9b;transform:translateX(-50%) rotate(var(--angle,0deg));transform-origin:top center;pointer-events:none;
}
#canvas .rwrap.sel-outline:not(.node-locked) > .rrotate-handle {display:inline-flex;}
#canvas.multi-select-active .rwrap > .rrotate-handle {display:none!important;pointer-events:none;}
#canvas .rrotate-readout{
  position:absolute;z-index:101;display:none;pointer-events:none;transform:translate(-50%,-100%);
  padding:3px 7px;white-space:nowrap;border-radius:6px;background:#513747;color:white;
  font:600 11px/1.5 system-ui,sans-serif;box-shadow:0 3px 9px #0003;
}
#canvas .rrotate-readout.active{display:block;}
.rotation-panel{padding:12px 0 8px;border-top:1px solid var(--border);}
.rotation-panel .row{display:flex;align-items:center;gap:7px;}
.rotation-panel .rotate-input{width:70px!important;flex:none!important;text-align:right;}
.rotation-panel button{white-space:nowrap;}

/* 8차: PPT식 자석 정렬선과 다중 선택 정렬/균등 간격. 편집기 안에서만 표시됩니다. */
#canvas .atelier-snap-guide {position:absolute;pointer-events:none;z-index:9996;background:#e35a9a;box-shadow:0 0 0 1px #fff9;}
#canvas .atelier-snap-guide.vertical {width:1.5px;}
#canvas .atelier-snap-guide.horizontal {height:1.5px;}
#canvas .atelier-snap-gap {position:absolute;pointer-events:none;z-index:9997;height:13px;border-top:1.5px solid #ad76bd;color:#864789;}
#canvas .atelier-snap-gap::before,#canvas .atelier-snap-gap::after{content:'';position:absolute;top:-5px;height:8px;width:1.5px;background:#ad76bd;}
#canvas .atelier-snap-gap::before{left:0}#canvas .atelier-snap-gap::after{right:0}
#canvas .atelier-snap-gap.vertical {width:13px;height:auto;border-top:0;border-left:1.5px solid #ad76bd;}
#canvas .atelier-snap-gap.vertical::before,#canvas .atelier-snap-gap.vertical::after{top:auto;left:-5px;width:8px;height:1.5px;}
#canvas .atelier-snap-gap.vertical::before{top:0}#canvas .atelier-snap-gap.vertical::after{bottom:0}
#snap-toggle.is-off{opacity:.58}
.align-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;}
.align-controls button{font-size:11px;min-width:0;white-space:normal;min-height:33px;}
.align-controls .gap-action{grid-column:span 3;}

/* Multiple decoration layers, each remains individually editable */
.decor-layer-section{border:1px solid var(--border-2);border-radius:10px;padding:12px;margin:8px 0}
.decor-layer-item{border:1px solid var(--border-2);background:var(--bg-2,#faf7f8);border-radius:9px;padding:9px;margin:10px 0}
.decor-layer-head{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:7px;flex-wrap:wrap}
.decor-layer-head span:not(.decor-layer-actions){color:var(--text-3);font-size:11px}
.decor-layer-actions{margin-left:auto;display:flex;gap:3px}
.decor-layer-actions button{cursor:pointer;min-width:25px;height:25px;border-radius:5px;border:1px solid var(--border-2);background:var(--bg-1,#fff);color:var(--text-2,#555)}
.decor-layer-actions button:disabled{opacity:.35;cursor:not-allowed}
.decor-layer-item .row{gap:8px;flex-wrap:wrap}
.decor-layer-item .row input[type=color]{height:29px;width:52px;padding:2px;border:1px solid var(--border-2);border-radius:5px;cursor:pointer}
.decor-layer-item .row input[type=text]{min-width:80px;flex:1;max-width:180px}
.decor-layer-item .row .hint{font-size:10px}
.decor-layer-visible{font-size:12px;display:inline-flex;align-items:center;gap:5px;margin-top:4px;cursor:pointer}
.decor-add-row{display:flex;gap:6px;margin-top:8px}
.decor-add-row select{flex:1;min-width:0}
.decor-add-row button{flex-shrink:0}
.decor-hex{font-size:11px;color:var(--text-3)}

/* 8.7 — PPT-style properties panel: consistent grid, rhythm, and clear categories */
#panel-right .inspector-body{padding:12px 12px 22px;min-height:180px;display:flex;flex-direction:column;gap:10px;}
#panel-right .inspector-body > .subsec,
#panel-right .inspector-body > .rotation-panel{
  margin:0!important;padding:13px 12px!important;border:1px solid var(--border)!important;
  background:var(--bg-elem);border-radius:10px;min-width:0;
}
#panel-right .inspector-body > .subsec .sec-title{
  font-size:12px;font-weight:700;line-height:1.5;letter-spacing:0;
  margin:0 0 11px!important;color:var(--text);
}
#panel-right .inspector-body > .subsec > .row{margin:7px 0;}
#panel-right .inspector-body > .subsec > .row:first-of-type{margin-top:0;}
#panel-right .inspector-body .row .lab{width:74px;min-width:74px;flex-shrink:0;line-height:1.4;}
#panel-right .inspector-body .row select{max-width:100%;min-width:0;}
#panel-right .inspector-body .row input[type=range]{min-width:45px;}
#panel-right .inspector-body .row input.num{flex-shrink:0;}
#panel-right .inspector-body > .subsec .hint{font-size:10px;line-height:1.6;}
#panel-right .inspector-body > .palette-section .theme-grid{margin-top:0;}
#panel-right .inspector-body > .palette-section .theme-toggle{margin-top:9px;}
#panel-right .inspector-tabs{padding:0 10px;gap:3px;}
#panel-right .inspector-tabs button{font-size:12px;padding:11px 2px;transition:background .12s;}
#panel-right .inspector-tabs button.active{border-bottom-width:3px;}
#panel-right .inspector-body .decor-layer-section{border:1px solid var(--border)!important;margin:0!important;}
#panel-right .inspector-body .decor-layer-item{margin:8px 0;padding:10px;border-radius:8px;}
#panel-right .inspector-body .inspector-tip{padding:12px 2px;}
@media(max-width:430px){#panel-right .inspector-body{padding:10px 10px 18px;gap:9px;}#panel-right .inspector-body > .subsec{padding:11px 10px!important;}}

#panel-right .inspector-body .decor-layer-head{align-items:center;margin:0;gap:5px}
#panel-right .inspector-body .decor-layer-head > strong{white-space:nowrap}
#panel-right .inspector-body .decor-layer-head .decor-layer-actions{margin-left:auto;gap:3px;flex-wrap:wrap;justify-content:flex-end}
#panel-right .inspector-body .decor-layer-editor-toggle{font-size:10px!important;white-space:nowrap;min-width:46px;border-color:var(--accent)!important;color:var(--accent-text)!important}
#panel-right .inspector-body .decor-layer-fields{margin-top:10px;padding-top:9px;border-top:1px solid var(--border)}
#panel-right .inspector-body .decor-layer-fields[hidden]{display:none!important}
#panel-right .inspector-body .decor-layer-item{background:var(--bg-panel);}

/* 8.8 — Color Studio unified picker */
.studio-pop{width:min(332px,calc(100vw - 16px))!important;max-height:calc(100dvh - 18px);overflow:auto;padding:14px!important;z-index:10001!important;border-radius:13px!important;box-shadow:0 15px 48px #1f122b38!important}
.pop-backdrop{z-index:10000!important}
.studio-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:14px;color:var(--text)}
.studio-head button{font-size:12px}
.studio-preview{display:flex;align-items:center;gap:9px;margin-bottom:11px;padding:6px 7px;border:1px solid var(--border);border-radius:8px}
.studio-checker,.studio-history-swatch{background:repeating-conic-gradient(#dedede 0% 25%,#fff 0% 50%) 0/10px 10px}
.studio-checker{width:31px;height:27px;border:1px solid var(--border-2);border-radius:5px;overflow:hidden;flex:none}.studio-checker span{display:block;width:100%;height:100%}
.studio-preview input{flex:1;min-width:0;font:12px ui-monospace,monospace;border:none;background:transparent;color:var(--text)}.studio-preview>span:last-child{font-size:11px;color:var(--text-2)}
.studio-square{height:149px;border:1px solid var(--border-2);border-radius:7px;cursor:crosshair;position:relative;touch-action:none;overflow:hidden}
.studio-square-white,.studio-square-black{pointer-events:none;position:absolute;inset:0}.studio-square-white{background:linear-gradient(to right,#fff,transparent)}.studio-square-black{background:linear-gradient(to top,#000,transparent)}
#studio-cursor{position:absolute;pointer-events:none;width:13px;height:13px;border:2px solid white;box-shadow:0 0 0 1px #333,0 1px 4px #0005;border-radius:50%;transform:translate(-50%,-50%)}
.studio-scale{display:grid;grid-template-columns:64px minmax(0,1fr) 43px;gap:7px;align-items:center;margin:9px 0}.studio-scale label{font-size:11px;color:var(--text-2)}.studio-scale input{width:100%;min-width:0;height:10px;cursor:pointer;accent-color:#7ca68f}.studio-scale #studio-h{background:linear-gradient(to right,red,#ff0,lime,cyan,blue,#f0f,red)}.studio-scale output{font:10px ui-monospace,monospace;text-align:right;color:var(--text-3)}
.studio-rgb{display:flex;align-items:center;gap:8px;margin-top:13px;border-top:1px solid var(--border);padding-top:12px}.studio-rgb>span{font-size:11px;color:var(--text-2);margin-right:auto}.studio-rgb label{font-size:10px;text-align:center;color:var(--text-3);display:flex;flex-direction:column;gap:3px}.studio-rgb input{width:57px;padding:5px 2px;text-align:center;background:var(--bg-panel);border:1px solid var(--border-2);border-radius:6px;color:var(--text)}
.studio-history-label{margin-top:14px;font-weight:650;font-size:12px;margin-bottom:8px}.studio-history{display:flex;flex-wrap:wrap;gap:6px}.studio-history-swatch{border:1px solid var(--border-2);border-radius:6px;width:28px;height:28px;padding:0;overflow:hidden}.studio-history-swatch:before{content:'';display:block;width:100%;height:100%;background:var(--history-color)}.studio-history-swatch:hover{outline:2px solid var(--accent)}.studio-hint{color:var(--text-3);font-size:10px;margin-top:8px;line-height:1.4}

/* 8.9 - restrained PPT-style property hints and shadow direction pad */
#panel-right .inspector-help{position:relative;vertical-align:middle;margin-left:6px;border:0;background:none;color:var(--text-3);font-size:13px;cursor:help;padding:1px 4px;border-radius:6px;line-height:1.4}
#panel-right .inspector-help:hover,#panel-right .inspector-help:focus-visible{background:var(--accent-bg)}
#panel-right .inspector-help-pop{display:none;position:absolute;z-index:999;top:calc(100% + 6px);right:-10px;width:min(250px,70vw);font-size:11px;color:var(--text);font-weight:400;white-space:normal;text-align:left;line-height:1.6;background:var(--bg-elem);border:1px solid var(--border-2);box-shadow:0 6px 16px #0002;border-radius:9px;padding:10px;pointer-events:none}
#panel-right .inspector-help:hover .inspector-help-pop,#panel-right .inspector-help:focus .inspector-help-pop,#panel-right .inspector-help.help-open .inspector-help-pop{display:block}
#panel-right .shadow-dir-wrap{display:flex;align-items:center;gap:10px;margin:10px 0}
#panel-right .shadow-dir-label{font-size:11px;color:var(--text-2);min-width:74px}
#panel-right .shadow-direction{display:grid;grid-template-columns:repeat(3,34px);gap:4px}
#panel-right .shadow-direction button{height:28px;border:1px solid var(--border-2);background:var(--bg-2);color:var(--text);border-radius:6px;cursor:pointer}
#panel-right .shadow-direction button.on{border-color:var(--accent);background:var(--accent-bg);font-weight:750}
#panel-right .unit-label{color:var(--text-3);font-size:11px}
</style>
</head>
<body>

<div class="topbar">

  <div class="file-menu-wrap"><button class="mini file-trigger" onclick="toggleFileMenu(event)" aria-haspopup="true" aria-controls="file-menu">☰ 파일 ▾</button>
    <div id="file-menu" class="file-menu" hidden>
      <button onclick="openImportModal();closeFileMenu()">HTML/CSS 가져오기</button>
      <button onclick="exportJSON();closeFileMenu()">프로젝트 JSON 저장</button>
      <button onclick="importJSON();closeFileMenu()">프로젝트 JSON 불러오기</button>
      <button onclick="exportHTML();closeFileMenu()">HTML 파일 내보내기</button>
      <button onclick="openExportPanel();closeFileMenu()">HTML 코드 보기·복사</button>
    </div>
  </div>
  <button onclick="undo()" id="undo-btn" class="mini" disabled><svg class="ic" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg> 실행취소</button>
  <button onclick="redo()" id="redo-btn" class="mini" disabled><svg class="ic" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h1"/></svg> 다시실행</button>
  <span class="save-status" id="save-status">자동 저장 켜짐 · JSON 파일로도 백업할 수 있어요</span>

// Multiple selection is editor-only state; it is never written to exported HTML.
function liveSelection(){
  // The existing editor uses sel=null to explicitly clear selection.
  // Honor that legacy contract so templates, importing and reset don't keep stale picks.
  if(!sel||!findNode(sel))return [];
  const ids=[...selectedIds].filter(id=>!!findNode(id));
  if(!ids.includes(sel))return [sel];
  return ids;
}
function reconcileSelection(){
  const ids=liveSelection();selectedIds=new Set(ids);
  if(!ids.includes(sel))sel=ids[0]||null;
}
function effectiveRoots(ids,skipLocked){
  const selected=new Set(ids),roots=[];
  for(const id of ids){
    const n=findNode(id);if(!n||(skipLocked&&n.locked))continue;
    let ancestor=findParent(id),nested=false;
    while(ancestor){if(selected.has(ancestor.id)&&(!skipLocked||!ancestor.locked)){nested=true;break;}ancestor=findParent(ancestor.id);}
    if(!nested)roots.push(id);
  }
  return roots;
}

// The visible rotation handle stays above the actual rotated top edge.
function positionRotationHandle(w){
  if(!w)return;
  const elem=w.querySelector(':scope > .rbox'),handle=w.querySelector(':scope > .rrotate-handle');
  if(!elem||!handle)return;
  const node=findNode(Number(w.dataset.nodeId));if(!node)return;
  const a=normalizeRotation(node.rotate||0)*Math.PI/180;
  const width=elem.offsetWidth||w.offsetWidth,height=elem.offsetHeight||w.offsetHeight;
  const cx=elem.offsetLeft+width/2,cy=elem.offsetTop+height/2;
  const rad=height/2+38;
  const hx=cx+Math.sin(a)*rad,hy=cy-Math.cos(a)*rad;

  handle.style.setProperty('--angle',normalizeRotation(node.rotate||0)+'deg');

  if(badge){badge.style.left=hx+'px';badge.style.top=(hy-19)+'px';badge.textContent=normalizeRotation(node.rotate||0)+'°';}

let rotationDrag=null;
function startRotationDrag(e,node,elem,wrap,handle){

function finishInlineTextEdit(commit){

  const n=findNode(ed.nodeId);if(!n)return;

// 8차: 화면 좌표 기준 정렬(서로 다른 부모의 자식도 화면상 정렬). 실제 좌표값은 offsetX/Y에만 반영합니다.
function nodeRectsFor(ids){
  const out=[];
  for(const id of ids){
    const el=document.querySelector('#canvas .rwrap[data-node-id="'+id+'"]');
    if(!el)continue;
    const r=el.getBoundingClientRect();
    if(r.width>0&&r.height>0)out.push({id,left:r.left,right:r.right,top:r.top,bottom:r.bottom,
      cx:(r.left+r.right)/2,cy:(r.top+r.bottom)/2,width:r.width,height:r.height});
  }
  return out;
}
function selectionRectsForArrange(){
  // 부모+자식이 동시에 잡혀도 부모만 이동합니다. 잠금은 움직이지 않습니다.
  const ids=effectiveRoots(liveSelection(),true);
  return nodeRectsFor(ids);
}
function updateNodeOffsets(changes){
  if(!changes.length)return false;
  pushUndo();
  for(const x of changes){const n=findNode(x.id);if(!n)continue;
    n.offsetX=Math.round((Number(n.offsetX)||0)+x.dx);
    n.offsetY=Math.round((Number(n.offsetY)||0)+x.dy);
  }
  renderAll();return true;
}
function alignSelected(kind){
  const rects=selectionRectsForArrange();
  if(rects.length<2){toast('잠금 해제된 박스를 2개 이상 선택해 주세요');return;}
  const isX=['left','centerX','right'].includes(kind);
  const keys={left:'left',centerX:'cx',right:'right',top:'top',centerY:'cy',bottom:'bottom'};
  const key=keys[kind];if(!key)return;
  // 처음 선택한 박스를 정렬 기준으로 유지해 PPT처럼 예상 가능한 결과를 만듭니다.
  const primary=rects.find(r=>r.id===sel)||rects[0];
  const changes=rects.filter(r=>r.id!==primary.id).map(r=>({id:r.id,dx:isX?primary[key]-r[key]:0,dy:isX?0:primary[key]-r[key]}))
    .filter(c=>Math.abs(c.dx)>0.5||Math.abs(c.dy)>0.5);
  if(updateNodeOffsets(changes))toast('선택한 박스 정렬 완료');else toast('이미 정렬되어 있어요');
}
function distributeSelected(axis){
  const rects=selectionRectsForArrange();
  if(rects.length<3){toast('간격을 맞추려면 잠금 해제된 박스 3개 이상을 선택해 주세요');return;}
  const x=axis==='x',p=x?'left':'top',q=x?'right':'bottom',size=x?'width':'height';
  rects.sort((a,b)=>a[p]-b[p]||a.id-b.id);
  const available=rects[rects.length-1][p]-rects[0][q]-rects.slice(1,-1).reduce((sum,r)=>sum+r[size],0);
  const gap=available/(rects.length-1);
  let cursor=rects[0][q]+gap;
  const changes=[];
  for(const r of rects.slice(1,-1)){
    const delta=cursor-r[p];
    if(Math.abs(delta)>0.5)changes.push({id:r.id,dx:x?delta:0,dy:x?0:delta});
    cursor+=r[size]+gap;
  }
  if(updateNodeOffsets(changes))toast((x?'가로':'세로')+' 간격 균등 배치 완료');else toast('이미 같은 간격으로 배치되어 있어요');
}
// 캔버스에만 그려지는 안내선 (HTML 출력에는 포함되지 않습니다).
function clearSnapGuides(){document.querySelectorAll('#canvas .atelier-snap-guide, #canvas .atelier-snap-gap').forEach(el=>el.remove());}
function drawSnapLine(axis,coord){
  const cv=document.getElementById('canvas'),r=cv.getBoundingClientRect();
  const el=document.createElement('div');el.className='atelier-snap-guide '+(axis==='x'?'vertical':'horizontal');
  if(axis==='x')Object.assign(el.style,{left:(coord-r.left)+'px',top:'0',height:cv.clientHeight+'px'});
  else Object.assign(el.style,{top:(coord-r.top)+'px',left:'0',width:cv.clientWidth+'px'});
  cv.appendChild(el);
}
function drawEqualGap(axis,start,end,mid){
  const cv=document.getElementById('canvas'),r=cv.getBoundingClientRect(),el=document.createElement('div');
  el.className='atelier-snap-gap'+(axis==='y'?' vertical':'');
  if(axis==='x')Object.assign(el.style,{left:(start-r.left)+'px',top:(mid-r.top)+'px',width:Math.max(0,end-start)+'px'});
  else Object.assign(el.style,{top:(start-r.top)+'px',left:(mid-r.left)+'px',height:Math.max(0,end-start)+'px'});
  cv.appendChild(el);
}
function boundsUnion(rects){
  const left=Math.min(...rects.map(r=>r.left)),right=Math.max(...rects.map(r=>r.right));
  const top=Math.min(...rects.map(r=>r.top)),bottom=Math.max(...rects.map(r=>r.bottom));
  return {left,right,top,bottom,width:right-left,height:bottom-top,cx:(left+right)/2,cy:(top+bottom)/2};
}
function computeSnap(d,rawX,rawY,disable){
  clearSnapGuides();
  if(disable||!d.startRects?.length)return{dx:rawX,dy:rawY};
  const cv=document.getElementById('canvas'),cr=cv.getBoundingClientRect();
  const start=boundsUnion(d.startRects),moving=new Set(d.ids);
  const excluded=new Set(d.ids);
  // 움직이는 부모의 자식 및 움직이는 자식의 부모는 기준선에서 제외.
  for(const el of cv.querySelectorAll('.rwrap[data-node-id]')){
    let w=el.parentElement,inside=false;
    while(w&&w!==cv){if(w.matches?.('.rwrap[data-node-id]')&&moving.has(Number(w.dataset.nodeId))){inside=true;break;}w=w.parentElement;}
    if(inside)excluded.add(Number(el.dataset.nodeId));
  }
  for(const id of d.ids){let parent=findParent(id);while(parent){excluded.add(parent.id);parent=findParent(parent.id);}}
  const targets=nodeRectsFor(Array.from(cv.querySelectorAll('.rwrap[data-node-id]'))
    .map(el=>Number(el.dataset.nodeId)).filter(id=>!excluded.has(id)));
  const centerX=cr.left+cr.width/2,centerY=cr.top+cr.height/2;
  targets.push({id:0,left:cr.left,right:cr.right,cx:centerX,top:cr.top,bottom:cr.bottom,cy:centerY,width:cr.width,height:cr.height,canvas:true});
  const tolerance=7;
  function bestAxis(axis,delta){
    const horizontal=axis==='x';
    const fields=horizontal?['left','cx','right']:['top','cy','bottom'];
    const refs=horizontal?[start.left,start.cx,start.right]:[start.top,start.cy,start.bottom];
    let best=null;
    for(const t of targets){
      for(let i=0;i<3;i++)for(let j=0;j<3;j++){
        // Canvas center & boundaries; against other objects all edge/center pairs.
        if(t.canvas&&i!==j)continue;
        const wanted=t[fields[j]]-refs[i],distance=Math.abs(wanted-delta);
        const priority=t.canvas?(i===1?0:2):1;
        if(distance<=tolerance&&(!best||distance<best.distance-.01||(Math.abs(distance-best.distance)<.01&&priority<best.priority)))
          best={value:wanted,distance,priority,line:t[fields[j]],type:'align'};
      }
    }
    // A single moving object between two other boxes: snap to equal left/right (top/bottom) gaps.
    if(d.ids.length===1){
      const r={left:start.left+rawX,right:start.right+rawX,top:start.top+rawY,bottom:start.bottom+rawY};
      // 가장 가까운 좌/우(상/하) 후보 3개씩만 비교해 문서가 커져도 부담을 줄입니다.
      const neighbors=targets.filter(t=>!t.canvas).filter(t=>horizontal
        ?t.bottom>=r.top-25&&t.top<=r.bottom+25
        :t.right>=r.left-25&&t.left<=r.right+25);
      const befores=neighbors.filter(t=>(horizontal?t.right:t.bottom)<=(horizontal?r.left:r.top)+tolerance)
        .sort((a,b)=>(horizontal?b.right-a.right:b.bottom-a.bottom)).slice(0,3);
      const afters=neighbors.filter(t=>(horizontal?t.left:t.top)>=(horizontal?r.right:r.bottom)-tolerance)
        .sort((a,b)=>(horizontal?a.left-b.left:a.top-b.top)).slice(0,3);
      for(const before of befores)for(const after of afters){
        if(before.id===after.id)continue;
        if(horizontal){
          if(before.right>r.left+tolerance||after.left<r.right-tolerance)continue;
          if(before.bottom<r.top-25||after.bottom<r.top-25||before.top>r.bottom+25||after.top>r.bottom+25)continue;
          const desired=(before.right+after.left-start.width)/2-start.left;
          const distance=Math.abs(desired-delta);
          if(distance<=tolerance&&(!best||distance<best.distance-.01))best={value:desired,distance,type:'space',before,after};
        }else{
          if(before.bottom>r.top+tolerance||after.top<r.bottom-tolerance)continue;
          if(before.right<r.left-25||after.right<r.left-25||before.left>r.right+25||after.left>r.right+25)continue;
          const desired=(before.bottom+after.top-start.height)/2-start.top;
          const distance=Math.abs(desired-delta);
          if(distance<=tolerance&&(!best||distance<best.distance-.01))best={value:desired,distance,type:'space',before,after};
        }
      }
    }
    return best;
  }
  const bx=bestAxis('x',rawX),by=bestAxis('y',rawY);
  const dx=bx?bx.value:rawX,dy=by?by.value:rawY;
  if(bx){if(bx.type==='align')drawSnapLine('x',bx.line);
    else{const a=bx.before,b=bx.after;const mid=(start.cy+dy);drawEqualGap('x',a.right,start.left+dx,mid);drawEqualGap('x',start.right+dx,b.left,mid);}}
  if(by){if(by.type==='align')drawSnapLine('y',by.line);
    else{const a=by.before,b=by.after;const mid=(start.cx+dx);drawEqualGap('y',a.bottom,start.top+dy,mid);drawEqualGap('y',start.bottom+dy,b.top,mid);}}
  return{dx,dy};
}

// 마우스/펜은 빈 공간 드래그, 터치는 선택 후 여백 드래그.
function beginSurfaceMove(e,node,wrap){
  if(e.button!==0||node.locked||e.target.closest('.rwrap')!==wrap)return;
  if(e.shiftKey||e.ctrlKey||e.metaKey||multiPickMode||e.altKey)return;
  if(e.target.closest('button,input,textarea,select,a,summary,iframe,[contenteditable="true"],.node-more,.rhandle,.rhandle-h'))return;
  // PPT와 동일하게 평소 텍스트 선택을 막고, 어느 부분을 잡아도 이동할 수 있어요.
  // 텍스트 편집은 더블클릭 후 contenteditable로만 진입합니다.
  const group=liveSelection().includes(node.id)?effectiveRoots(liveSelection(),true):[node.id];
  if(!group.length)return;
  surfaceDrag={id:node.id,pointerId:e.pointerId,wrap,ids:group,
    starts:group.map(id=>{const n=findNode(id);return{id,ox:Number(n.offsetX)||0,oy:Number(n.offsetY)||0};}),
    sx:e.clientX,sy:e.clientY,moving:false,
    startRects:nodeRectsFor(group)};
}
document.addEventListener('pointermove',e=>{
  const d=surfaceDrag;if(!d||e.pointerId!==d.pointerId)return;
  const n=findNode(d.id);if(!n){surfaceDrag=null;return;}
  const dx=e.clientX-d.sx,dy=e.clientY-d.sy;
  if(!d.moving&&Math.hypot(dx,dy)<6)return;
  if(!d.moving){
    pushUndo();d.moving=true;
    if(!liveSelection().includes(d.id))setSelection([d.id],d.id);
  }
  e.preventDefault();
  const snapped=computeSnap(d,dx,dy,!snapEnabled||e.altKey);
  for(const o of d.starts){
    const target=findNode(o.id);if(!target)continue;
    target.offsetX=Math.round(o.ox+snapped.dx);target.offsetY=Math.round(o.oy+snapped.dy);
    const el=document.querySelector('#canvas .rwrap[data-node-id="'+o.id+'"]');
    if(el){el.style.position=target.placement==='absolute'?'absolute':'relative';el.style.left=target.offsetX+'px';el.style.top=target.offsetY+'px';}
  }
},{passive:false});
function finishSurfaceMove(e){
  const d=surfaceDrag;if(!d||(e&&e.pointerId!==d.pointerId))return;
  surfaceDrag=null;
  clearSnapGuides();
  if(d.moving){ignoreCanvasClickUntil=performance.now()+300;renderAll();}
}
document.addEventListener('pointerup',finishSurfaceMove);
document.addEventListener('pointercancel',finishSurfaceMove);

// PPT-like rectangular marquee. Start from empty canvas; Alt+drag also works over a box.
function marqueeCoordinates(e){
  const r=document.getElementById('canvas').getBoundingClientRect();
  return{x:e.clientX-r.left,y:e.clientY-r.top};
}
(function setupMarquee(){
  const cv=document.getElementById('canvas');
  cv.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.pointerType==='touch'||activeTextEdit)return;
    // The wrapper can span the whole row even when the visible badge is tiny.
    // Its transparent area must count as empty canvas for marquee selection.
    const blank=!e.target.closest('.rbox,.node-more,.rresize-handle,.rrotate-handle');
    if(!blank&&!e.altKey)return;
    if(e.target.closest('button,input,textarea,select,[contenteditable="true"]'))return;
    e.preventDefault();closeColorPop();
    const p=marqueeCoordinates(e);
    const el=document.createElement('div');el.className='selection-marquee';el.style.cssText+='left:'+p.x+'px;top:'+p.y+'px;width:0;height:0';cv.appendChild(el);
    marqueeDrag={pointerId:e.pointerId,origin:p,x:p.x,y:p.y,overlay:el,add:!!e.shiftKey,initial:e.shiftKey?liveSelection():[],moving:false};
  });
  document.addEventListener('pointermove',e=>{
    const d=marqueeDrag;if(!d||e.pointerId!==d.pointerId)return;
    const p=marqueeCoordinates(e);d.x=p.x;d.y=p.y;
    if(Math.hypot(p.x-d.origin.x,p.y-d.origin.y)>5)d.moving=true;
    if(!d.moving)return;
    e.preventDefault();
    const left=Math.min(d.origin.x,p.x),top=Math.min(d.origin.y,p.y);
    Object.assign(d.overlay.style,{left:left+'px',top:top+'px',width:Math.abs(p.x-d.origin.x)+'px',height:Math.abs(p.y-d.origin.y)+'px'});
  },{passive:false});
  function finish(e){
    const d=marqueeDrag;if(!d||(e&&e.pointerId!==d.pointerId))return;
    marqueeDrag=null;d.overlay.remove();if(!d.moving)return;
    ignoreCanvasClickUntil=performance.now()+120;
    const cvRect=cv.getBoundingClientRect();
    const left=cvRect.left+Math.min(d.origin.x,d.x),right=cvRect.left+Math.max(d.origin.x,d.x);
    const top=cvRect.top+Math.min(d.origin.y,d.y),bottom=cvRect.top+Math.max(d.origin.y,d.y);
    const found=[];
    cv.querySelectorAll('.rwrap[data-node-id]').forEach(el=>{
      if(el.closest('.rwrap[data-node-id]')!==el)return;
      // Test the visible shape, not .rwrap: an inline badge's wrapper may
      // stretch across the parent row, making it impossible to fully enclose.
      const shape=el.querySelector(':scope > .rbox') || el;
      const r=shape.getBoundingClientRect();
      // Select shapes fully enclosed by the marquee, as PowerPoint normally does.
      if(r.width>0&&r.height>0&&r.left>=left-2&&r.right<=right+2&&r.top>=top-2&&r.bottom<=bottom+2)
        found.push(Number(el.dataset.nodeId));
    });
    const ids=d.add?[...new Set([...d.initial,...found])]:found;
    setSelection(ids,ids[0]||null);
  }
  document.addEventListener('pointerup',finish);
  document.addEventListener('pointercancel',finish);
})();

function renderCanvas(){
 const cv=document.getElementById('canvas');canvasContentHeight=0;
 cv.style.cssText=getCanvasStyle()+'margin:0 auto;';cv.innerHTML=canvasBgMarkup();
 if(tree.length===0){cv.innerHTML='<div class="no-sel" style="padding:48px 0">왼쪽에서 요소·템플릿을 추가하세요</div>';return;}

// 편집용 별칭은 프로젝트에 저장되며, 출력 시 구조 설명에도 사용해요.
function friendlyNodeName(node){
 if(node.displayName&&String(node.displayName).trim())return String(node.displayName).trim();
 const kind=LABELS[node.type]||node.type||'요소';
 let example=String(node.text||'').trim().split(/\r?\n/)[0];
 if(!example&&node.children&&node.children.length){
   const first=node.children.find(c=>c.type==='heading'||c.type==='text');
   if(first)example=String(first.text||'').trim().split(/\r?\n/)[0];
 }
 if(example)return kind+' · '+(example.length>17?example.slice(0,17)+'…':example);

function renameNode(id){

const collapsedTreeNodes=new Set();
function toggleTreeCollapsed(id){if(collapsedTreeNodes.has(id))collapsedTreeNodes.delete(id);else collapsedTreeNodes.add(id);renderTree();}
function renderTree(){
 const t=document.getElementById('tree');t.innerHTML='';
 if(tree.length===0){t.innerHTML='<div class="hint">아직 요소가 없습니다.</div>';return;}
 function walk(list,depth){list.forEach(function(n){
  const div=document.createElement('div');div.className='tree-node'+(liveSelection().includes(n.id)?' multi-tree-sel':'')+(sel===n.id?' sel':'');div.style.marginLeft=(depth*13)+'px';if(depth)div.style.borderLeft='2px solid var(--border-2)';
  const main=document.createElement('span');main.className='tree-main';main.innerHTML=icon(n.type)+' '+esc(friendlyNodeName(n))+(n.children?' ('+n.children.length+')':'');main.title='더블클릭하면 이름을 바꿀 수 있어요';main.onclick=function(e){e.stopPropagation();selectCanvasNode(n.id,null,e);};main.ondblclick=function(e){e.stopPropagation();renameNode(n.id);};
  const actions=document.createElement('span');actions.className='tree-actions';

  for(const [delta,label] of [[-1,'↑'],[1,'↓']]){const b=document.createElement('button');b.textContent=label;b.title='HTML 순서 '+(delta<0?'앞으로':'뒤로');b.disabled=delta<0?idx===0:idx===list.length-1;b.onclick=function(e){e.stopPropagation();moveOrder(n.id,delta);};actions.appendChild(b);}
  const toggle=document.createElement('button');toggle.type='button';toggle.className='tree-toggle';
  const hasChildren=!!(n.children||n.type==='preserved');
  toggle.textContent=hasChildren?(collapsedTreeNodes.has(n.id)?'▸':'▾'):'·';
  toggle.disabled=!hasChildren;toggle.title='자식 요소 접기/펼치기';
  toggle.onclick=function(e){e.stopPropagation();toggleTreeCollapsed(n.id);};
  div.appendChild(toggle);div.appendChild(main);div.appendChild(actions);div.onclick=function(e){selectCanvasNode(n.id,null,e);};t.appendChild(div);
  if(!collapsedTreeNodes.has(n.id)){
  if(n.type==='preserved')appendPreservedTree(n,depth+1,t);
  if(n.children)walk(n.children,depth+1);

}

const STUDIO_HISTORY_KEY='atelier-studio-recent-1';
let studioHistory=[];try{studioHistory=JSON.parse(localStorage.getItem(STUDIO_HISTORY_KEY)||'[]');if(!Array.isArray(studioHistory))studioHistory=[];}catch(e){}
let studioState=null;
function studioRgb(hex){const c=safeHex(hex,'#888888');return[1,3,5].map(i=>parseInt(c.substring(i,i+2),16));}
function studioHex(r,g,b){return'#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('').toUpperCase();}
function studioRgbToHsv(r,g,b){r/=255;g/=255;b/=255;const m=Math.max(r,g,b),n=Math.min(r,g,b),d=m-n;let h=0;if(d){if(m===r)h=((g-b)/d)%6;else if(m===g)h=(b-r)/d+2;else h=(r-g)/d+4;h=(h*60+360)%360;}return[h,d?d/m*100:0,m*100];}
function studioHsvToRgb(h,s,v){s/=100;v/=100;const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;const z=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return z.map(y=>Math.round((y+m)*255));}
function studioColor(){return studioHex(...studioHsvToRgb(studioState.h,studioState.s,studioState.v));}
function studioRemember(hex,alpha){const item={hex:safeHex(hex),alpha:Math.round(alpha)};studioHistory=[item,...studioHistory.filter(x=>x.hex!==item.hex||x.alpha!==item.alpha)].slice(0,16);try{localStorage.setItem(STUDIO_HISTORY_KEY,JSON.stringify(studioHistory));}catch(e){}}
function closeColorPop(){if(studioState&&studioState.dirty){studioRemember(studioColor(),studioState.a);addRecent(studioColor());}studioState=null;document.getElementById('color-pop')?.remove();document.getElementById('pop-backdrop')?.remove();renderProps();renderCanvasSettings();}
function openColorPop(btn,id,prop,hasOn){openStudioColor(btn,'node',prop,id,hasOn);}
function openStudioColor(btn,type,prop,id=null,hasOn=false){
 if(studioState)closeColorPop();
 const obj=type==='canvas'?canvasSettings:findNode(id);if(!obj)return;
 const alphaKey=type==='canvas'?prop+'Alpha':(prop==='fill'?'fillAlpha':prop+'Alpha');
 const alphaEnabled=type==='canvas'?['bgFrom','bgTo'].includes(prop):['fill','gradFrom','gradTo','txtGradFrom','txtGradTo'].includes(prop);
 const hex=type==='node'&&hasOn?obj[prop]?.val:obj[prop];
 const [h,s,v]=studioRgbToHsv(...studioRgb(hex));
 studioState={type,prop,id,hasOn,alphaKey,alphaEnabled,h,s,v,a:alphaEnabled?(obj[alphaKey]??100):100,dirty:false};
 const bd=document.createElement('div');bd.className='pop-backdrop';bd.id='pop-backdrop';bd.onclick=closeColorPop;document.body.appendChild(bd);
 const p=document.createElement('div');p.id='color-pop';p.className='color-pop studio-pop';p.innerHTML=`
 <div class="studio-head"><strong>🎨 색상 선택</strong><button type="button" onclick="closeColorPop()" aria-label="색상 선택 닫기">✕</button></div>
 <div class="studio-preview"><span class="studio-checker"><span id="studio-preview-swatch"></span></span><input id="studio-hex" maxlength="7" aria-label="HEX 색상 코드"><span id="studio-alpha-label"></span></div>
 <div class="studio-square" id="studio-square" role="group" aria-label="채도와 명도 선택"><div class="studio-square-white"></div><div class="studio-square-black"></div><span id="studio-cursor"></span></div>
 <div class="studio-scale"><label>색상 H</label><input id="studio-h" type="range" min="0" max="360" step="1"><output id="studio-h-out"></output></div>
 <div class="studio-scale"><label>채도 S</label><input id="studio-s" type="range" min="0" max="100" step="1"><output id="studio-s-out"></output></div>
 <div class="studio-scale"><label>명도 V</label><input id="studio-v" type="range" min="0" max="100" step="1"><output id="studio-v-out"></output></div>
 <div class="studio-scale"><label>불투명도</label><input id="studio-a" type="range" min="0" max="100" step="1" ${alphaEnabled?'':'disabled'}><output id="studio-a-out"></output></div>
 ${!alphaEnabled?'<div class="studio-hint">투명도는 배경색·그라데이션 색상에서 조절할 수 있어요.</div>':''}
 <div class="studio-rgb"><span>RGB</span>${['R','G','B'].map(ch=>`<label>${ch}<input type="number" id="studio-${ch.toLowerCase()}" min="0" max="255"></label>`).join('')}</div>

 <div class="studio-hint">색상 사각형 · RGB · HSV를 바꾸면 모두 동기화돼요.</div>`;
 document.body.appendChild(p);
 const bounds=btn.getBoundingClientRect(),pw=Math.min(332,window.innerWidth-16);
 p.style.left=Math.max(8,Math.min(window.innerWidth-pw-8,bounds.left-pw+40))+'px';
 p.style.top=Math.max(8,Math.min(window.innerHeight-p.offsetHeight-8,bounds.top-16))+'px';
 p.querySelector('#studio-square').addEventListener('pointerdown',e=>{const square=e.currentTarget;square.setPointerCapture(e.pointerId);const drag=ev=>{const r=square.getBoundingClientRect();studioState.s=Math.max(0,Math.min(100,(ev.clientX-r.left)/r.width*100));studioState.v=100-Math.max(0,Math.min(100,(ev.clientY-r.top)/r.height*100));studioApply();};drag(e);square.onpointermove=ev=>{if(ev.buttons)drag(ev);};square.onpointerup=()=>{square.onpointermove=null;};});

function studioRefresh(){const st=studioState,p=document.getElementById('color-pop');if(!st||!p)return;

 p.querySelector('#studio-cursor').style.left=st.s+'%';p.querySelector('#studio-cursor').style.top=(100-st.v)+'%';
 p.querySelector('#studio-h').value=st.h;p.querySelector('#studio-s').value=st.s;p.querySelector('#studio-v').value=st.v;p.querySelector('#studio-a').value=st.a;
 p.querySelector('#studio-h-out').textContent=Math.round(st.h)+'°';p.querySelector('#studio-s-out').textContent=Math.round(st.s)+'%';p.querySelector('#studio-v-out').textContent=Math.round(st.v)+'%';p.querySelector('#studio-a-out').textContent=Math.round(st.a)+'%';

 p.querySelectorAll('[data-idx]').forEach(b=>b.onclick=()=>{const x=studioHistory[Number(b.dataset.idx)];[st.h,st.s,st.v]=studioRgbToHsv(...studioRgb(x.hex));st.a=st.alphaEnabled?x.alpha:100;studioApply();});
}
function studioApply(){const st=studioState;if(!st)return;const obj=st.type==='canvas'?canvasSettings:findNode(st.id);if(!obj)return;
 if(!st.dirty){pushUndo();st.dirty=true;}
 const hex=studioColor();if(st.type==='node'&&st.hasOn){obj[st.prop].val=hex;obj[st.prop].on=true;}else obj[st.prop]=hex;
 if(st.alphaEnabled)obj[st.alphaKey]=st.a;
 renderCanvas();updateOutput();saveState();studioRefresh();
}

// Dedicated multi-element inspector: no accidental one-element-only changes.

  const ids=liveSelection();

  const tHTML=THEMES.slice(0,4).map((t,i)=>themeCell(t,i)).join('');

   '<div class="row" style="margin:0"><button onclick="deleteSel()" class="danger" style="flex:1">선택한 요소 삭제</button><button onclick="clearMultiSelection()" style="flex:1">선택 해제</button></div>'+

   '<div class="row"><button onclick="copyFormat()" style="flex:1">기준 박스 서식 복사</button><button onclick="pasteFormat()" style="flex:1"'+(fmtClip?'':' disabled')+'>선택 박스에 붙여넣기</button></div>'+
   '<div class="sec-title">▦ 정렬 · 간격 맞춤</div>'+

   '<p class="hint">정렬은 2개 이상, 간격 균등은 3개 이상 선택하세요. 맨 양쪽(위·아래) 박스는 고정하고 중간 박스를 옮겨요.</p>'+

function applyMultiTheme(index){
  const t=THEMES[index];if(!t)return;
  const ids=liveSelection().filter(id=>!['html','preserved','img','barcode'].includes(findNode(id)?.type));
  if(!ids.length){toast('일괄 테마를 적용할 수 있는 요소가 없어요');return;}
  pushUndo();
  ids.forEach(id=>{const n=findNode(id);n.fillType='solid';n.txtGrad=false;

const FMT_KEYS=['glow','glowColor','glowAlpha','glowMode','decor','decorColor','decorCharA','decorCharB','decorLayers','edgeCount','edgeDepth','anim',
 'fillType','fill','gradFrom','gradTo','gradAngle','color','txtGrad','txtGradFrom','txtGradTo','txtGradAngle',

 for(const key of FMT_KEYS)if(n[key]!==undefined)style[key]=structuredClone(n[key]);
 // 바코드 고유 색상은 바코드끼리 복사할 때만 반영해요.

 // 변한 값이 없으면 불필요한 실행취소 기록은 남기지 않아요.
 const changes=[];
 for(const n of targets){
   const patch={};
   for(const key of FMT_KEYS){
     if(style[key]!==undefined&&n[key]!==undefined&&JSON.stringify(style[key])!==JSON.stringify(n[key]))patch[key]=structuredClone(style[key]);
   }
   if(n.type==='barcode'&&fmtClip.sourceType==='barcode'){
     for(const key of ['barcodeColor','barcodeBg'])if(style[key]!==undefined&&style[key]!==n[key])patch[key]=structuredClone(style[key]);

}

function inlineAllStyles(root,styleMap){
  if(!styleMap||!Object.keys(styleMap).length)return;
  var allEls=root.querySelectorAll('*');
  var elList=[root];
  for(var i=0;i<allEls.length;i++)elList.push(allEls[i]);
  // Sort rules by specificity: simple first, compound later
  var rules=[];
  Object.keys(styleMap).forEach(function(sel){
    // Skip pseudo-element rules (handled separately)
    if(sel.indexOf('::')>=0||sel.indexOf(':before')>=0||sel.indexOf(':after')>=0)return;
    var parts=sel.split(',');
    parts.forEach(function(p){
      p=p.trim();if(!p)return;
      var depth=(p.match(/\s+/g)||[]).length+(p.match(/\./g)||[]).length*0.1;
      rules.push({sel:p,styles:styleMap[sel],depth:depth});
    });
  });
  rules.sort(function(a,b){return a.depth-b.depth;});
  // Apply rules to matching elements
  elList.forEach(function(el){
    if(!el.tagName)return;
    rules.forEach(function(rule){
      try{
        if(el.matches(rule.sel)){
          var existing=parseInlineStyle(el.getAttribute('style')||'');
          // Rule styles are overridden by more specific rules (applied in order) but NOT by existing inline
          // Actually: CSS specificity = inline > class. So existing inline should win.
          // But we want to MERGE: rule first, then inline overwrites
          var merged={};
          Object.assign(merged,rule.styles);
          Object.assign(merged,existing);
          // Write back as inline
          var str='';
          Object.keys(merged).forEach(function(k){str+=k+':'+merged[k]+';';});
          el.setAttribute('style',str);
        }
      }catch(e){}
    });
  });
}

function parseHTMLToNodes(html){
  var styleMap=parseStyleTag(html);
  var bodyHtml=html.replace(/<style[^>]*>[\s\S]*?<\/style>/gi,'').trim();
  var parser=new DOMParser();
  var doc=parser.parseFromString('<!DOCTYPE html><html><body>'+bodyHtml+'</body></html>','text/html');
  var body=doc.body;
  // Pre-process: inline all CSS rules onto elements
  inlineAllStyles(body,styleMap);
  var nodes=[];
  for(var i=0;i<body.children.length;i++){
    var ch=body.children[i];
    if(!ch.tagName)continue;
    var n=domToNode(ch,styleMap);
    if(n)nodes.push(n);
  }
  return nodes;
}

function doImport(mode){
  var code=(document.getElementById('import-code').value||'').trim();
  if(!code){toast('코드를 붙여넣어 주세요');return;}

  if(mode==='preserved'){
    const cleaned=sanitizePreserved(code);
    const node=mkNode('html');node.type='preserved';node.rawCode=cleaned;node.h=0;node.w=0;
    pushUndo();tree.push(node);sel=node.id;preservedSelection=null;closeImportModal();renderAll();toast('원본 CSS 유지 + 클릭 편집을 시작하세요');return;
  }
  if(mode==='raw'||mode==='raw-tpl'){
    var rawNode=mkNode('html');
    rawNode.rawCode=code;
    if(mode==='raw-tpl'){
      var name=prompt('템플릿 이름을 입력하세요:','불러온 글꾸');
      if(!name)return;
      userTemplates.push({name:name,data:[rawNode],idc:idc});
      saveUserTemplates();renderUserTemplates();
      closeImportModal();
      toast('템플릿 "'+name+'" 저장됨 (원본 HTML)');
    } else {
      pushUndo();
      rawNode.id=++idc;
      tree.push(rawNode);
      sel=rawNode.id;
      closeImportModal();
      renderAll();
      toast('원본 HTML 코드를 캔버스에 추가함');
    }
    return;
  }

  var nodes=parseHTMLToNodes(code);
  if(!nodes.length){toast('인식 가능한 HTML 요소를 찾지 못했습니다');return;}
  if(mode==='template'){
    var name=prompt('템플릿 이름을 입력하세요:','불러온 글꾸');
    if(!name)return;
    userTemplates.push({name:name,data:nodes,idc:idc});
    saveUserTemplates();renderUserTemplates();
    closeImportModal();
    toast('템플릿 "'+name+'" 저장됨 ('+nodes.length+'개 요소)');
  } else {
    pushUndo();
    function reid(nd){nd.id=++idc;if(nd.children)nd.children.forEach(reid);}
    nodes.forEach(reid);
    migrate(nodes);
    tree.push.apply(tree,nodes);
    sel=nodes[0].id;
    closeImportModal();
    renderAll();
    toast(nodes.length+'개 요소를 캔버스에 추가함');
  }
}

function fitLibraryThumbs(root=document){

   if(!el.offsetWidth)return;

   inner.style.transform='none';
   const w=Math.max(inner.scrollWidth,inner.clientWidth),h=Math.max(100,inner.scrollHeight);
   const scale=Math.min((el.clientWidth-12)/w,(el.clientHeight-12)/h,0.65);
   inner.style.transform='scale('+Math.max(0.10,scale)+')';
   inner.style.left=Math.max(0,(el.clientWidth-w*scale)/2)+'px';
   inner.style.top=Math.max(0,(el.clientHeight-h*scale)/2)+'px';
 }));
}

    const item=userMaterials[Number(key)];if(!item)return false;
    nodes=reidLibraryNodes(structuredClone(item.data));
  }else if(type==='starter-template')nodes=makeStarterNodes(key);
  else{
    const item=userTemplates[Number(key)];if(!item)return false;
    nodes=reidLibraryNodes(structuredClone(item.data));
  }
  if(!nodes.length)return false;
  // 여러 루트 요소를 가진 사용자 템플릿은 한 묶음으로 드롭하여 원래 세로 순서를 유지.
  if(nodes.length>1)nodes=[mkNode('box',{children:nodes,fill:{on:false,val:'#ffffff'},border:{on:false,val:'#ffffff'},bw:0,pad:0,gap:10,w:0})];
  const cv=document.getElementById('canvas');
  const width=Math.max(260,cv.clientWidth),margin=Number(canvasSettings.padding)||0;
  const root=nodes[0],estimateWidth=Number(root.w)||Math.min(270,width-2*margin);
  const maxX=Math.max(0,width-Math.min(estimateWidth,width)-5);
  // 커서 부근에 요소 왼쪽 위 모서리가 오도록 하되 캔버스 밖으로 나가지 않게.
  root.placement='absolute';root.offsetX=Math.min(maxX,Math.max(0,Math.round(x-25)));
  root.offsetY=Math.max(0,Math.round(y-18));
  pushUndo();tree.push(root);sel=root.id;preservedSelection=null;
  renderAll();toast('놓은 위치에 추가했어요! 여백을 잡고 다시 이동할 수 있어요.');
  return true;
}
function clearLibraryDrop(){
  document.getElementById('canvas')?.classList.remove('library-drop-ready');
  document.querySelector('.canvas-drop-mark')?.remove();
}
(function initCanvasDrop(){
  const cv=document.getElementById('canvas');
  cv.addEventListener('dragover',e=>{
    if(!activeLibraryDrag&&(!e.dataTransfer||!Array.from(e.dataTransfer.types).includes('application/x-atelier')))return;
    e.preventDefault();e.dataTransfer.dropEffect='copy';cv.classList.add('library-drop-ready');
    const p=previewDropPosition(e);
    let mark=cv.querySelector('.canvas-drop-mark');
    if(!mark){mark=document.createElement('div');mark.className='canvas-drop-mark';mark.textContent='+';cv.appendChild(mark);}
    mark.style.left=Math.max(0,p.x-12)+'px';mark.style.top=Math.max(0,p.y-12)+'px';
  });
  cv.addEventListener('dragleave',e=>{if(!cv.contains(e.relatedTarget))clearLibraryDrop();});
  cv.addEventListener('drop',e=>{
    e.preventDefault();e.stopPropagation();
    const p=previewDropPosition(e);
    let info=activeLibraryDrag;
    if(!info){try{info=JSON.parse(e.dataTransfer.getData('application/x-atelier'));}catch(_){}}
    clearLibraryDrop();activeLibraryDrag=null;
    dropNodesFromLibrary(info,p.x,p.y);
  });
  document.addEventListener('dragend',()=>{activeLibraryDrag=null;clearLibraryDrop();});
})();

// ===== 선택 요소 오른쪽 클릭 / ⋯ 메뉴 =====
function closeNodeContextMenu(){document.getElementById('node-context-menu')?.remove();}
function toggleNodeLock(id){const n=findNode(id);if(!n)return;pushUndo();n.locked=!n.locked;sel=id;renderAll();toast(n.locked?'요소 이동·크기 조절을 잠갔어요':'요소 잠금을 해제했어요');}
function openNodeMenuAction(id,action){
  closeNodeContextMenu();
  if(action==='delete-many'){deleteSel();return;}
  if(action==='multi-style'){mobileTabIfNeeded('right');document.getElementById('props').scrollIntoView({block:'nearest'});return;}
  if(action==='copy-format'){copyFormat(id);return;}
  if(action==='paste-format'){pasteFormat();return;}
  sel=id;
  if(action==='duplicate'){duplicateSel();return;}
  if(action==='front'||action==='back'){changeLayer(id,action);return;}
  if(action==='up'||action==='down'){moveOrder(id,action==='up'?-1:1);return;}
  if(action==='lock'){toggleNodeLock(id);return;}
  if(action==='save'){saveSelectedMaterial();return;}
  if(action==='rename'){renameNode(id);return;}
  if(action==='delete'){deleteSel();return;}
}
function showNodeContextMenu(clientX,clientY,id){
  const n=findNode(id);if(!n)return;closeNodeContextMenu();
  const m=document.createElement('div');m.id='node-context-menu';m.className='node-context-menu';
  m.setAttribute('role','menu');
  const group=(entries)=>entries.forEach(([title,act])=>{
    const b=document.createElement('button');b.type='button';b.textContent=title;b.setAttribute('role','menuitem');
    if(act==='delete')b.classList.add('danger-action');
    b.addEventListener('click',e=>{e.stopPropagation();openNodeMenuAction(id,act);});m.appendChild(b);
  });
  if(liveSelection().length>1){
    group([['✿  '+liveSelection().length+'개 함께 꾸미기','multi-style'],['🎨  기준 요소 서식 복사','copy-format'],['🖌  선택한 요소에 서식 붙여넣기','paste-format'],['✕  선택한 요소 모두 삭제','delete-many']]);
    document.body.appendChild(m);
    m.style.left=Math.max(8,Math.min(clientX,window.innerWidth-m.offsetWidth-8))+'px';
    m.style.top=Math.max(8,Math.min(clientY,window.innerHeight-m.offsetHeight-8))+'px';
    return;
  }
  group([['⧉  복제','duplicate'],['🎨  서식 복사  Ctrl+Shift+C','copy-format'],['🖌  서식 붙여넣기  Ctrl+Shift+V','paste-format']]);
  m.appendChild(document.createElement('hr'));
  group([['↑  맨 앞으로 (겹침)','front'],['↓  맨 뒤로 (겹침)','back']]);
  m.appendChild(document.createElement('hr'));
  group([['⇡  HTML 순서 위로','up'],['⇣  HTML 순서 아래로','down'],[n.locked?'🔓  이동 잠금 해제':'🔒  이동 잠금','lock']]);
  m.appendChild(document.createElement('hr'));
  group([['✎  요소 이름 바꾸기','rename'],['✿  내 소재로 저장','save'],['✕  요소 삭제','delete']]);
  document.body.appendChild(m);
  const x=Math.max(8,Math.min(clientX,window.innerWidth-m.offsetWidth-8));
  const y=Math.max(8,Math.min(clientY,window.innerHeight-m.offsetHeight-8));
  m.style.left=x+'px';m.style.top=y+'px';
}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#node-context-menu,.node-more'))closeNodeContextMenu();});
document.addEventListener('scroll',e=>{if(e.target!==document.getElementById('node-context-menu'))closeNodeContextMenu();},true);
