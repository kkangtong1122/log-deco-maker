// PPT식 오브젝트 클립보드: 자식 요소 전체를 복사하며, ID는 붙여넣을 때 재발급됩니다.
const OBJECT_CLIP_PREFIX='ATELIER_NODE_V1:';
function reidClipboardNode(node){node.id=++idc;if(Array.isArray(node.children))node.children.forEach(reidClipboardNode);}
function copySelectedObject(cut){
  const ids=liveSelection();
  if(ids.length>1){
    const roots=effectiveRoots(ids,false);
    // Preserve the visible document order inside the clipboard bundle.
    const order=[];
    function walk(list){list.forEach(n=>{order.push(n.id);if(n.children)walk(n.children);});}
    walk(tree);
    roots.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
    atelierClipboard=JSON.stringify({bundleType:'multi',nodes:roots.map(id=>structuredClone(findNode(id)))});
    atelierClipboardContext=null;
    if(navigator.clipboard?.writeText)navigator.clipboard.writeText(OBJECT_CLIP_PREFIX+atelierClipboard).catch(()=>{});
    if(cut){deleteSel();toast(roots.length+'개 요소 잘라내기 완료');}
    else toast(roots.length+'개 요소 복사 완료');
    return true;
  }
  const n=sel?findNode(sel):null;
  if(!n)return false;
  atelierClipboard=JSON.stringify(n);
  const parent=findParent(n.id),siblings=getSiblings(n.id);
  atelierClipboardContext={parentId:parent?.id||null,index:siblings.findIndex(item=>item.id===n.id)};
  // 외부 탭에서도 복사한 오브젝트를 옮길 수 있게 가능한 경우 OS 클립보드에 기록.
  // 접근 거부/로컬 HTML 환경에서도 내부 클립보드 복사는 항상 작동합니다.
  if(navigator.clipboard?.writeText){navigator.clipboard.writeText(OBJECT_CLIP_PREFIX+atelierClipboard).catch(()=>{});}
  if(cut){deleteSel();toast('요소 잘라내기 완료 · Ctrl+V로 붙여넣기');}
  else toast('요소 복사 완료 · Ctrl+V로 붙여넣기');
  return true;
}
function pasteSelectedObject(source){
  let json=source||atelierClipboard;
  if(!json)return false;
  try{
    if(json.startsWith(OBJECT_CLIP_PREFIX))json=json.slice(OBJECT_CLIP_PREFIX.length);
    const node=JSON.parse(json);
    if(node?.bundleType==='multi'&&Array.isArray(node.nodes)){
      const copies=node.nodes.filter(n=>n&&typeof n.id==='number'&&n.type).map(n=>structuredClone(n));
      if(!copies.length)return false;
      pushUndo();
      copies.forEach(n=>{reidClipboardNode(n);n.offsetX=(Number(n.offsetX)||0)+18;n.offsetY=(Number(n.offsetY)||0)+18;tree.push(n);});
      renderAll();setSelection(copies.map(n=>n.id),copies[0].id);
      toast(copies.length+'개 요소 붙여넣기 완료');return true;
    }
    if(!node||!node.type||typeof node.id!=='number')return false;
    const copy=structuredClone(node);
    reidClipboardNode(copy);
    copy.offsetX=(Number(copy.offsetX)||0)+18;
    copy.offsetY=(Number(copy.offsetY)||0)+18;
    const hasSelection=!!(sel&&findNode(sel));
    const parent=atelierClipboardContext?.parentId?findNode(atelierClipboardContext.parentId):null;
    const sib=hasSelection?getSiblings(sel):(parent?.children||tree);
    const index=hasSelection?sib.findIndex(n=>n.id===sel):
      (atelierClipboardContext?Math.min(sib.length,atelierClipboardContext.index)-1:sib.length-1);
    pushUndo();sib.splice(index+1,0,copy);
    sel=copy.id;preservedSelection=null;renderAll();toast('요소 붙여넣기 완료');return true;
  }catch(e){return false;}
}
// 키 입력 중 연속 이동은 하나의 실행취소 단계로 묶습니다.
function nudgeSelectedByArrow(e){
  const ids=effectiveRoots(liveSelection(),true);
  if(!ids.length)return false;
  const step=e.shiftKey?10:1;
  const dx=e.key==='ArrowLeft'?-step:e.key==='ArrowRight'?step:0;
  const dy=e.key==='ArrowUp'?-step:e.key==='ArrowDown'?step:0;
  if(!arrowNudgeActive){pushUndo();arrowNudgeActive=true;}
  ids.forEach(id=>{const n=findNode(id);n.offsetX=(Number(n.offsetX)||0)+dx;n.offsetY=(Number(n.offsetY)||0)+dy;});
  renderCanvas();syncSelectionUI();renderProps();updateOutput();saveState();return true;
}
document.addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))arrowNudgeActive=false;});
window.addEventListener('blur',()=>{arrowNudgeActive=false;});

document.addEventListener('keydown',function(e){
  const ctrl=e.ctrlKey||e.metaKey;
  const t=e.target,tag=t&&t.tagName;
  const typing=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable);
  // 대화 상자와 텍스트 입력 중에는 기본 클립보드/방향키 동작을 보존합니다.
  if(typing||document.querySelector('.import-overlay,.library-dialog,[role="dialog"]'))return;
  if(ctrl&&e.shiftKey&&!e.altKey&&(e.key==='c'||e.key==='C')){e.preventDefault();copyFormat();return;}
  if(ctrl&&e.shiftKey&&!e.altKey&&(e.key==='v'||e.key==='V')){e.preventDefault();pasteFormat();return;}
  if(ctrl&&!e.altKey&&!e.shiftKey&&(e.key==='c'||e.key==='C')){
    if(copySelectedObject(false))e.preventDefault();return;
  }
  if(ctrl&&!e.altKey&&!e.shiftKey&&(e.key==='x'||e.key==='X')){
    if(copySelectedObject(true))e.preventDefault();return;
  }
  if(ctrl&&!e.altKey&&!e.shiftKey&&(e.key==='v'||e.key==='V')){
    if(sel||atelierClipboard){
      e.preventDefault();
      if(navigator.clipboard?.readText){
        navigator.clipboard.readText().then(text=>{
          if(text.startsWith(OBJECT_CLIP_PREFIX))pasteSelectedObject(text);
          else toast('일반 텍스트는 글을 더블클릭한 뒤 붙여넣어 주세요');
        }).catch(()=>{if(!pasteSelectedObject())toast('복사한 요소가 없어요');});
      }else if(!pasteSelectedObject())toast('복사한 요소가 없어요');
    }
    return;
  }
  if(ctrl&&!e.altKey&&!e.shiftKey&&(e.key==='a'||e.key==='A')){if(tree.length){e.preventDefault();selectAllCanvas();}return;}
  if(ctrl&&(e.key==='y'||e.key==='Y')){e.preventDefault();redo();return;}
  if(ctrl&&e.shiftKey&&(e.key==='z'||e.key==='Z')){e.preventDefault();redo();return;}
  if(ctrl&&!e.shiftKey&&(e.key==='z'||e.key==='Z')){e.preventDefault();undo();return;}
  if(ctrl&&(e.key==='d'||e.key==='D')){if(sel){e.preventDefault();duplicateSel();}return;}
  if(!ctrl&&!e.altKey&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
    if(nudgeSelectedByArrow(e)){e.preventDefault();}return;
  }
  if(!ctrl&&(e.key==='Delete'||e.key==='Backspace')&&sel){e.preventDefault();deleteSel();return;}
  if(e.key==='Escape'){
    if(document.getElementById('node-context-menu')){closeNodeContextMenu();return;}
    clearMultiSelection();closeColorPop();return;
  }
});
